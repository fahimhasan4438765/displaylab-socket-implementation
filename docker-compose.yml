services:
  displaylab-socket:
    build: .
    container_name: displaylab-socket
    restart: unless-stopped
    ports:
      # host:container — reachable on the VPS as 127.0.0.1:8090
      - "127.0.0.1:8090:8090"
    environment:
      HTTP_ADDR: ":8090"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-displaylab-local-socket-key}
      WS_ALLOW_ORIGINS: ${WS_ALLOW_ORIGINS:-*}
