version: "3"

services:
  displaylab-socket:
    build: .
    container_name: displaylab-socket
    restart: unless-stopped
    ports:
      # reachable on the VPS as 127.0.0.1:8090 only
      - "127.0.0.1:8090:8090"
    environment:
      HTTP_ADDR: ":8090"
      INTERNAL_API_KEY: displaylab-local-socket-key
      WS_ALLOW_ORIGINS: "*"
